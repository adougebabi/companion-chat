[project]
name = "fluctlight-core"
version = "0.1.0"
description = "Fluctlight clean-start Core platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.5",
  "boto3==1.40.0",
  "fastapi==0.116.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.11.7",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.43",
  "temporalio==1.20.0",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
serve-api = "fluctlight_core.entrypoints.api:main"
run-worker = "fluctlight_core.entrypoints.worker:main"
run-migrations = "fluctlight_core.entrypoints.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fluctlight_core"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
