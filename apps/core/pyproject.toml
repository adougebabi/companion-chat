[project]
name = "fluctlight-core"
version = "0.1.0"
description = "Fluctlight Temporal runtime gate fixture"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "temporalio==1.20.0",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
serve-api = "fluctlight_core.temporal_gate.api_entrypoint:main"
run-worker = "fluctlight_core.temporal_gate.worker_entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fluctlight_core"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
