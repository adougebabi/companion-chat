server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The Web image is only a same-origin static/proxy entry point. Browser
    # auth, DTO, NDJSON and media policy live in the Go API process; Nginx
    # does not transform requests or expose /internal routes.
    location ~ ^/(api|auth|health)(/|$) {
        proxy_pass http://core:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 11m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
