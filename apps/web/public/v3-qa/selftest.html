  await click('[data-test=corr-cancel]'); log(S().get('memories', 'm31').version === 1 && S().get('memories', 'm31').content === '海边书店已经停业', 'A3 取消不改变记忆');
  D().querySelector('[data-test="wrong-msg_007"]').click(); await sleep(150); await click('[data-test=mode-owner]');
  await click('[data-test=simulate-conflict]'); await click('[data-test=corr-save]'); await click('[data-test=confirm-ok]', '切换管理身份');
  log(!!await until(() => D().querySelector('[data-test=conflict]')), 'A4 版本冲突面板出现');
  await click('[data-test=refresh-resubmit]'); await click('[data-test=corr-save]'); await click('[data-test=confirm-ok]', '二次确认');
  const m31 = await until(() => S().get('memories', 'm31').content === '海边书店暂停装修中（未停业）' && S().get('memories', 'm31'));
  log(!!m31 && m31.version === 3, 'A5 记忆 #m31 已更新（v3）', m31 ? m31.content : '');
  log(S().get('messages', 'msg_007').corrected && S().get('messages', 'msg_007').text.includes('已经停业'), 'A6 原消息挂已纠正且原文不改写');
  log(S().auditLog().some(a => a.identity === '所有者修改' && a.target === 'm31'), 'A7 审计记录 所有者修改 m31');
  await sleep(200); log(!!D().querySelector('[data-msg="msg_007"] [data-test=corrected]'), 'A8 聊天中显示“已纠正”');
  await nav('#/c/c1/growth/memory/m31'); log(D().querySelector('[data-test=memory-content]')?.textContent === '海边书店暂停装修中（未停业）' && D().querySelectorAll('[data-test=rev]').length === 3, 'A9 记忆页同一内容 + 3 条修订');
  // ---------- 流程 B ----------
  await nav('#/c/c1/life/goals'); log(!!D().querySelector('[data-test=goal-g_dress]'), 'B1 目标页显示意向 g_dress');
  await nav('#/c/c1/chat'); await click('[data-test=act-request]');
  log(!!await until(() => S().get('items', 'it_dress').status === '拥有', 5000), 'B2 行动 a_buy 完成，it_dress 入库');
  log(S().get('goals', 'g_dress').state === '已确认' && S().get('schedule', 's_shop').state === '已确认' && S().get('actions', 'a_buy').state === '已确认', 'B3 目标/日程/行动状态联动');
  await nav('#/c/c1/life/wardrobe?item=it_dress'); await sleep(200);
  log(!S().get('outfit').c1.current.includes('it_dress'), 'B4 换装前未穿着');
  await click('[data-test=outfit-request]');
  log(!!await until(() => S().get('outfit').c1.current.includes('it_dress')), 'B5 小遥接受后才换装');
  log(!S().get('outfit').c1.current.includes('it_coat'), 'B6 碎花裙替换了外套');
  const before = JSON.stringify(S().get('outfit').c1); const mc = S().list('media').length;
  await sleep(200); await click('[data-test=photo-now]'); await click('[data-test=gen-go]');
  log(!!await until(() => D().querySelector('[data-test=gen-result]')), 'B7 拍照生成完成');
  const md = S().list('media', m => m.itemId === 'it_dress')[0];
  log(md && md.nonFact && md.outfitSnapshot.includes('it_dress') && S().list('media').length === mc + 1, 'B8 媒体 md_ 关联物品与穿搭快照，标非事实', md ? md.id : '');
  log(JSON.stringify(S().get('outfit').c1) === before, 'B9 拍照不改变事实（穿着不变）');
  await nav('#/c/c1/media'); log(!!D().querySelector(`[data-test="media-${md?.id}"] [data-badge="生成图·非事实"]`), 'B10 媒体库显示「生成图·非事实」');
  // ---------- 流程 C ----------
  await nav('#/studio/edit/r_book'); await click('[data-q="描述里加上海风"]');
  log(D().querySelector('[data-f="描述"]').value.includes('海风'), 'C1 助手修改同一份草稿（表单同步）');
  log(!!D().querySelector('[data-test=dirty]') && !S().get('resources', 'r_book').draft, 'C2 未保存前不写入');
  await click('[data-test=save-draft]'); await sleep(100);
  log(S().get('resources', 'r_book').draft?.描述.includes('海风') && S().get('resources', 'r_book').published === 'v4', 'C3 保存草稿≠发布');
  const mc2 = S().list('media').length; await click('[data-test=preview-gen]'); await sleep(100);
  log(S().get('studioDrafts').length === 1 && S().list('media').length === mc2 && !!D().querySelector('[data-test=preview-item] [data-badge="创作预览·不进入生活"]'), 'C4 创作预览只进 studioDrafts，媒体库不变');
  await click('[data-test=apply]'); log(!!await until(() => D().querySelector('[data-test=apply-conflict]')), 'C5 应用到实例显示与实例修正的冲突');
  await click('[data-test=apply-override]'); await click('[data-test=apply-confirm]'); await click('[data-test=confirm-ok]');
  const inst = await until(() => S().get('instances').c1.r_book.applied === 'v4' && S().get('instances').c1.r_book);
  log(!!inst && !inst.overrides.营业状态 && S().get('places', 'p_book').desc.includes('已重新开业'), 'C6 应用 v4 到小遥（覆盖修正，地点更新）');
  log(S().auditLog().some(a => a.summary.includes('应用定义')), 'C7 应用写入审计');
  await click('[data-test=publish]'); await click('[data-test=confirm-ok]'); await sleep(100);
  log(S().get('resources', 'r_book').published === 'v5' && S().get('instances').c1.r_book.applied === 'v4', 'C8 发布 v5 不自动改变实例');
  // ---------- 诊断/重置 ----------
  await nav('#/diag/task/t88'); await click('[data-test=retry]'); const t = S().get('tasks', 't88');
  log(t.state === '已确认' && t.runs === 2, 'D1 t88 重试仅补步骤 3-4');
  S().resetDemo(); await sleep(100);
  log(S().get('studioDrafts').length === 0 && S().get('memories', 'm31').version === 1 && S().auditLog().length === 0, 'D2 重置演示数据恢复种子并清空 studioDrafts');

  // ---------- 扩展页面（每页主操作） ----------
  await extended();
  log(errs.length === 0, '无控制台错误', errs.join(' | '));
  document.getElementById('summary').textContent = `RESULT pass=${pass} fail=${fail}`;
}

document.getElementById('f').onload = () => run().catch(e => { log(false, '异常', e.stack); document.getElementById('summary').textContent = `RESULT pass=${pass} fail=${fail + 1}`; });
