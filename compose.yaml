services:
  companion:
    image: ${COMPANION_IMAGE:-your-dockerhub-username/companion-chat:latest}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-4178}:4178"
    volumes:
      - companion-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  companion-data:
