name: Fluctlight CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.7
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.10.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: git diff --exit-code -- packages/core-client/openapi.json packages/core-client/src/index.ts packages/browser-client/openapi.json packages/browser-client/src/index.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: uv sync --locked
      - run: infra/acceptance/check-core-openapi.sh
      - run: uv run ruff format --check apps/core/src apps/core/tests
      - run: uv run ruff check apps/core/src apps/core/tests
      - run: uv run mypy --follow-imports=skip apps/core/src apps/core/tests
      - run: uv run pytest -q apps/core/tests
      - run: POSTGRES_PASSWORD=dummy S3_SECRET_KEY=dummy FLUCTLIGHT_CORE_SERVICE_KEY=dummy FLUCTLIGHT_SETTINGS_KEY=dummy docker compose -f infra/compose/fluctlight.compose.yml config
      - run: bash -n infra/acceptance/*.sh
      - run: infra/acceptance/validate-handoffs.sh
      - run: infra/acceptance/excluded-scope-guard.sh
      - run: |
          if [ -e server ] || [ -e web ] || [ -e test ] || [ -e Dockerfile ] || [ -e compose.yaml ]; then
            ! infra/acceptance/legacy-scope-guard.sh
          else
            infra/acceptance/legacy-scope-guard.sh
          fi

  publish:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fluctlight-core:latest

      - name: Build and push BFF
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/bff/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fluctlight-bff:latest

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_BFF_ORIGIN=${{ vars.PROD_BFF_ORIGIN || 'http://127.0.0.1:13000' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fluctlight-web:latest
