name: Fluctlight CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.7
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.10.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: git diff --exit-code -- packages/core-client/openapi.json packages/core-client/src/index.ts packages/browser-client/openapi.json packages/browser-client/src/index.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: uv sync --locked
      - run: infra/acceptance/check-core-openapi.sh
      - run: uv run ruff format --check apps/core/src apps/core/tests
      - run: uv run ruff check apps/core/src apps/core/tests
      - run: uv run mypy --follow-imports=skip apps/core/src apps/core/tests
      - run: uv run pytest -q apps/core/tests
      - run: docker compose -f infra/compose/fluctlight.compose.yml config
      - run: bash -n infra/acceptance/*.sh
      - run: infra/acceptance/validate-handoffs.sh
      - run: infra/acceptance/excluded-scope-guard.sh
      - run: |
          if [ -e server ] || [ -e web ] || [ -e test ] || [ -e Dockerfile ] || [ -e compose.yaml ]; then
            ! infra/acceptance/legacy-scope-guard.sh
          else
            infra/acceptance/legacy-scope-guard.sh
          fi
