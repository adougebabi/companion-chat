name: Fluctlight CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/go-*'
  pull_request:
    branches:
      - main
      - master
      - 'codex/go-*'
  workflow_dispatch:

jobs:
  # Parallel validation jobs: Go backend and Web frontend validate concurrently
  validate-go:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CORE_GO_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/core-go/go.mod
          cache-dependency-path: |
            apps/core-go/go.sum

      - name: Apply Go Core schema for database-backed tests
        working-directory: apps/core-go
        run: go run ./cmd/migrate

      - name: Test Go Core
        working-directory: apps/core-go
        run: go test -race ./...

      - name: Run Phase 8 Eino contract gate
        env:
          GO_CORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          ./infra/acceptance/run-phase8-contract-gates.sh "$RUNNER_TEMP/phase8-eino-contract-gate"

      - name: Vet Go Core
        run: |
          go -C apps/core-go vet ./...

      - name: Build Go Core
        run: |
          go -C apps/core-go build ./...

      - name: Verify Go formatting
        run: test -z "$(find apps/core-go -name '*.go' -print0 | xargs -0 gofmt -l)"

      - name: Verify Go-only runtime references
        run: ./infra/acceptance/go-core-reference-guard.sh

      - name: Verify legacy deletion scope
        run: ./infra/acceptance/legacy-scope-guard.sh

      - name: Check Compose bind sources
        run: ./infra/acceptance/check-compose-bind-sources.sh

      - name: Validate Go-only Compose topology
        run: docker compose --env-file infra/compose/fluctlight.env.example -f infra/compose/fluctlight.compose.yml config --quiet

  validate-web:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install browser workspace
        run: pnpm install --frozen-lockfile

      - name: Regenerate API clients
        run: pnpm generate

      - name: Check generated artifacts are clean
        run: git diff --exit-code

      - name: Check Go Core OpenAPI route parity
        run: ./infra/acceptance/check-core-openapi.sh

      - name: Typecheck browser workspace
        run: pnpm typecheck

      - name: Test browser workspace
        run: pnpm test

      - name: Build browser workspace
        run: pnpm build

  # Aggregated validation gate preserved for branch protection and downstream dependencies
  validate:
    needs: [validate-go, validate-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all validations passed
        run: |
          if [ "${{ needs.validate-go.result }}" != "success" ] || [ "${{ needs.validate-web.result }}" != "success" ]; then
            echo "One or more validation jobs failed: validate-go=${{ needs.validate-go.result }}, validate-web=${{ needs.validate-web.result }}"
            exit 1
          fi
          echo "All validations passed successfully"

  # The integration branch is the only non-production branch allowed to push
  # images. Stage branches should merge here before their images are shared.
  compose-smoke:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/go-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare disposable Compose environment
        shell: bash
        run: |
          {
            echo 'FLUCTLIGHT_ENV=ci'
            echo 'FLUCTLIGHT_CORE_SERVICE_KEY=ci-core-service-key'
            echo 'FLUCTLIGHT_SETTINGS_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
            echo 'FLUCTLIGHT_TRUSTED_ORIGIN=http://127.0.0.1:13001'
            echo 'FLUCTLIGHT_SECURE_COOKIES=false'
            echo 'POSTGRES_USER=fluctlight'
            echo 'POSTGRES_PASSWORD=ci-postgres-password'
            echo 'POSTGRES_DB=fluctlight'
            echo 'REDIS_URL=redis://redis:6379/0'
            echo 'S3_ACCESS_KEY=fluctlight'
            echo 'S3_SECRET_KEY=ci-s3-secret'
            echo 'S3_BUCKET=fluctlight-media'
            echo 'TEMPORAL_NAMESPACE=default'
            echo 'TEMPORAL_WORKER_BUILD_ID=ci-smoke'
          } > "$RUNNER_TEMP/fluctlight.env"

      - name: Run disposable Compose smoke
        env:
          FLUCTLIGHT_ENV_FILE: ${{ runner.temp }}/fluctlight.env
        run: ./infra/compose/run-platform-smoke.sh

  go-build:
    needs: [validate, compose-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/go-build'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            file: apps/core-go/Dockerfile
            image: fluctlight-core-go
          - name: web
            file: apps/web/Dockerfile
            image: fluctlight-web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:go-build
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:go-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Production tags remain protected by the main/master branch boundary.
  publish:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            file: apps/core-go/Dockerfile
            image: fluctlight-core-go
          - name: web
            file: apps/web/Dockerfile
            image: fluctlight-web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
