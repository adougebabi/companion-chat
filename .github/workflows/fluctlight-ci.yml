name: Fluctlight CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.7
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.10.12

  publish:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-core:latest

      - name: Build and push BFF
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/bff/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-bff:latest

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-web:latest
