name: Fluctlight CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/go-*'
  pull_request:
    branches:
      - main
      - master
      - 'codex/go-*'
  workflow_dispatch:

jobs:
  # Every Go stage branch is buildable without publishing credentials or
  # overwriting an image that is used by production Compose deployments.
  validate:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/core-go/go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Read the exact version from package.json's packageManager field.
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install browser workspace
        run: pnpm install --frozen-lockfile

      - name: Test Go modules
        working-directory: apps/gateway-go
        run: go test -race ./...

      - name: Test Go Core module
        working-directory: apps/core-go
        run: go test -race ./...

      - name: Vet Go modules
        working-directory: apps/gateway-go
        run: go vet ./...

      - name: Vet Go Core module
        working-directory: apps/core-go
        run: go vet ./...

      - name: Build Go modules
        working-directory: apps/gateway-go
        run: go build ./...

      - name: Build Go Core module
        working-directory: apps/core-go
        run: go build ./...

      - name: Verify Go formatting
        run: test -z "$(find apps/core-go apps/gateway-go -path '*/.gocache*' -prune -o -path '*/.gomodcache*' -prune -o -name '*.go' -print0 | xargs -0 gofmt -l)"

      - name: Verify Go-only runtime references
        run: ./infra/acceptance/go-core-reference-guard.sh

      - name: Verify legacy deletion scope
        run: ./infra/acceptance/legacy-scope-guard.sh

      - name: Verify handoff evidence
        run: ./infra/acceptance/validate-handoffs.sh

      - name: Regenerate API clients
        run: pnpm generate

      - name: Check generated artifacts are clean
        run: git diff --exit-code

      - name: Check Go Core OpenAPI route parity
        run: ./infra/acceptance/check-core-openapi.sh

      - name: Check Compose bind sources
        run: ./infra/acceptance/check-compose-bind-sources.sh

      - name: Validate Go-only Compose topology
        run: docker compose --env-file infra/compose/fluctlight.env.example -f infra/compose/fluctlight.compose.yml config --quiet

      - name: Typecheck browser workspace
        run: pnpm typecheck

      - name: Test browser workspace
        run: pnpm test

      - name: Build browser workspace
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go Core and Worker image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core-go/Dockerfile
          push: false
          tags: fluctlight-core-go:validate-${{ github.sha }}

      - name: Build Go BFF image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway-go/Dockerfile
          push: false
          tags: fluctlight-bff:validate-${{ github.sha }}

      - name: Build Web image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: fluctlight-web:validate-${{ github.sha }}

  # The integration branch is the only non-production branch allowed to push
  # images. Stage branches should merge here before their images are shared.
  compose-smoke:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/go-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare disposable Compose environment
        shell: bash
        run: |
          {
            echo 'FLUCTLIGHT_ENV=ci'
            echo 'FLUCTLIGHT_CORE_SERVICE_KEY=ci-core-service-key'
            echo 'FLUCTLIGHT_SETTINGS_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
            echo 'FLUCTLIGHT_TRUSTED_ORIGIN=http://127.0.0.1:13001'
            echo 'FLUCTLIGHT_BFF_ORIGIN=http://127.0.0.1:13000'
            echo 'FLUCTLIGHT_SECURE_COOKIES=false'
            echo 'POSTGRES_USER=fluctlight'
            echo 'POSTGRES_PASSWORD=ci-postgres-password'
            echo 'POSTGRES_DB=fluctlight'
            echo 'REDIS_URL=redis://redis:6379/0'
            echo 'S3_ACCESS_KEY=fluctlight'
            echo 'S3_SECRET_KEY=ci-s3-secret'
            echo 'S3_BUCKET=fluctlight-media'
            echo 'TEMPORAL_NAMESPACE=default'
            echo 'TEMPORAL_WORKER_BUILD_ID=ci-smoke'
          } > "$RUNNER_TEMP/fluctlight.env"

      - name: Run disposable Compose smoke
        env:
          FLUCTLIGHT_ENV_FILE: ${{ runner.temp }}/fluctlight.env
        run: ./infra/compose/run-platform-smoke.sh

  go-build:
    needs: [validate, compose-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/go-build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Go Core and Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core-go/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-core-go:go-build
            ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-core-go:go-${{ github.sha }}

      - name: Build and push BFF Go-build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway-go/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-bff:go-build
            ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-bff:go-${{ github.sha }}

      - name: Build and push Web Go-build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-web:go-build
            ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-web:go-${{ github.sha }}

  # Production tags remain protected by the main/master branch boundary.
  publish:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Go Core and Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core-go/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-core-go:latest

      - name: Build and push BFF
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway-go/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-bff:latest

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fluctlight-web:latest
