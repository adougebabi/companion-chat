name: Fluctlight CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/go-*'
      - codex/fact-only-reply-vision
      - codex/fluctlight-functional-recovery
      - codex/demo-fullsite-audit-20261028
  pull_request:
    branches:
      - main
      - master
      - 'codex/go-*'
      - codex/fact-only-reply-vision
      - codex/fluctlight-functional-recovery
      - codex/demo-fullsite-audit-20261028
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_IMAGE_CHANNEL: ${{ github.ref == 'refs/heads/codex/demo-fullsite-audit-20261028' && 'demo-fullsite-audit' || (github.ref == 'refs/heads/codex/fluctlight-functional-recovery' && 'functional-recovery' || 'fact-only') }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # Keep CI lightweight: formatting is the only pre-build validation.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/core-go/go.mod
          cache: false

      - name: Verify Go formatting
        run: test -z "$(find apps/core-go -name '*.go' -print0 | xargs -0 gofmt -l)"

  go-build:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/go-build'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            file: apps/core-go/Dockerfile
            image: fluctlight-core-go
            build_args: GOPROXY=https://proxy.golang.org,direct
          - name: web
            file: apps/web/Dockerfile
            image: fluctlight-web
            build_args: NPM_REGISTRY=https://registry.npmjs.org
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:go-build
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:go-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Test images never share a mutable tag with the stable publication jobs.
  test-image-build:
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/codex/fact-only-reply-vision' || github.ref == 'refs/heads/codex/fluctlight-functional-recovery' || github.ref == 'refs/heads/codex/demo-fullsite-audit-20261028')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            file: apps/core-go/Dockerfile
            image: fluctlight-core-go
            build_args: GOPROXY=https://proxy.golang.org,direct
          - name: web
            file: apps/web/Dockerfile
            image: fluctlight-web
            build_args: NPM_REGISTRY=https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - name: Verify the actual checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable test image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:${{ env.TEST_IMAGE_CHANNEL }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.fluctlight.source.ref=${{ github.ref }}
            io.fluctlight.build.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record this image digest
        env:
          RELEASE_COMPONENT: ${{ matrix.name }}
          RELEASE_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 infra/release/fact_only_release.py record --output "${RELEASE_COMPONENT}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_IMAGE_CHANNEL }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.name }}.json
          if-no-files-found: error

  test-image-promote:
    needs: test-image-build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/codex/fact-only-reply-vision' || github.ref == 'refs/heads/codex/fluctlight-functional-recovery' || github.ref == 'refs/heads/codex/demo-fullsite-audit-20261028')
    runs-on: ubuntu-latest
    concurrency:
      group: test-image-promotion-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.TEST_IMAGE_CHANNEL }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-images
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Verify the complete set and promote only the current branch head
        run: python3 infra/release/fact_only_release.py promote --directory release-images --output "${TEST_IMAGE_CHANNEL}-release.json"
      - name: Preserve complete or partial promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_IMAGE_CHANNEL }}-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TEST_IMAGE_CHANNEL }}-release.json
          if-no-files-found: warn

  # Production tags remain protected by the main/master branch boundary.
  publish:
    needs: validate
    if: always() && needs.validate.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            file: apps/core-go/Dockerfile
            image: fluctlight-core-go
            build_args: GOPROXY=https://proxy.golang.org,direct
          - name: web
            file: apps/web/Dockerfile
            image: fluctlight-web
            build_args: NPM_REGISTRY=https://registry.npmjs.org
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
