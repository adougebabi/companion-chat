[project]
name = "local-ai-companion-runtime"
version = "0.1.0"
description = "Fluctlight clean-start Python runtime workspace"
requires-python = ">=3.13,<3.14"
dependencies = ["fluctlight-core"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.10",
]

[tool.uv.sources]
fluctlight-core = { workspace = true }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.workspace]
members = ["apps/core"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "compose: checks that require the local platform Compose topology",
    "integration: checks that require PostgreSQL or other local platform services",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
