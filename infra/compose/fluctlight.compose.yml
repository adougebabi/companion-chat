name: fluctlight

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluctlight}
      POSTGRES_USER: ${POSTGRES_USER:-fluctlight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in private env}
    volumes:
      - fluctlight_postgres:/var/lib/postgresql/data
      - ../postgres/10-temporal-databases.sql:/docker-entrypoint-initdb.d/10-temporal-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    networks: [platform]

  redis:
    image: redis:8.0.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - fluctlight_redis:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    networks: [platform]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fluctlight}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in private env}
    volumes:
      - fluctlight_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: ${MINIO_MEMORY_LIMIT:-512m}
    networks: [platform]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-fluctlight}:${S3_SECRET_KEY:?set S3_SECRET_KEY in private env}@minio:9000
    command: ["mb", "--ignore-existing", "--with-versioning", "local/${S3_BUCKET:-fluctlight-media}"]
    mem_limit: ${MINIO_INIT_MEMORY_LIMIT:-64m}
    networks: [platform]

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-fluctlight}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in private env}
      DBNAME: temporal
      VISIBILITY_DB: postgres12
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: "false"
      ENABLE_ES_SETTINGS: "false"
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      SERVICES: frontend,history,matching,worker
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: ${TEMPORAL_MEMORY_LIMIT:-1g}
    networks: [platform]

  migrate:
    image: ${CORE_GO_IMAGE:-${DOCKERHUB_USERNAME:-yourname}/fluctlight-core-go:latest}
    build:
      context: ../..
      dockerfile: apps/core-go/Dockerfile
    command: ["/usr/local/bin/fluctlight-migrate-go"]
    environment:
      CORE_GO_DATABASE_URL: postgresql://${POSTGRES_USER:-fluctlight}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in private env}@postgres:5432/${POSTGRES_DB:-fluctlight}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-128m}
    networks: [platform]

  cutover:
    image: ${CORE_GO_IMAGE:-${DOCKERHUB_USERNAME:-yourname}/fluctlight-core-go:latest}
    build:
      context: ../..
      dockerfile: apps/core-go/Dockerfile
    command: ["/usr/local/bin/fluctlight-cutover-go", "--apply"]
    environment:
      CORE_GO_DATABASE_URL: postgresql://${POSTGRES_USER:-fluctlight}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in private env}@postgres:5432/${POSTGRES_DB:-fluctlight}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TEMPORAL_WORKER_BUILD_ID: ${TEMPORAL_WORKER_BUILD_ID:-platform-v1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: "no"
    mem_limit: ${CUTOVER_MEMORY_LIMIT:-128m}
    networks: [platform]

  core:
    image: ${CORE_GO_IMAGE:-${DOCKERHUB_USERNAME:-yourname}/fluctlight-core-go:latest}
    build:
      context: ../..
      dockerfile: apps/core-go/Dockerfile
    environment: &core_environment
      CORE_GO_DATABASE_URL: postgresql://${POSTGRES_USER:-fluctlight}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in private env}@postgres:5432/${POSTGRES_DB:-fluctlight}
      FLUCTLIGHT_CORE_SERVICE_KEY: ${FLUCTLIGHT_CORE_SERVICE_KEY:?set FLUCTLIGHT_CORE_SERVICE_KEY in private env}
      FLUCTLIGHT_SETTINGS_KEY: ${FLUCTLIGHT_SETTINGS_KEY:?set FLUCTLIGHT_SETTINGS_KEY in private env}
      CORE_GO_LISTEN_ADDRESS: :8080
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-fluctlight-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fluctlight}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in private env}
      S3_USE_SSL: "false"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${CORE_MEMORY_LIMIT:-256m}
    networks: [platform]

  worker:
    image: ${CORE_GO_IMAGE:-${DOCKERHUB_USERNAME:-yourname}/fluctlight-core-go:latest}
    build:
      context: ../..
      dockerfile: apps/core-go/Dockerfile
    command: ["/usr/local/bin/fluctlight-worker-go"]
    restart: unless-stopped
    environment:
      <<: *core_environment
      CORE_GO_LISTEN_ADDRESS: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      cutover:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/fluctlight-worker.ready && find /tmp/fluctlight-worker.ready -mmin -1 -print -quit | grep -q ."]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: ${WORKER_MEMORY_LIMIT:-768m}
    networks: [platform]

  bff:
    image: ${BFF_IMAGE:-${DOCKERHUB_USERNAME:-yourname}/fluctlight-bff:latest}
    build:
      context: ../..
      dockerfile: apps/gateway-go/Dockerfile
    environment:
      CORE_BASE_URL: ${CORE_BASE_URL:-http://core:8080}
      FLUCTLIGHT_CORE_SERVICE_KEY: ${FLUCTLIGHT_CORE_SERVICE_KEY:?set FLUCTLIGHT_CORE_SERVICE_KEY in private env}
      FLUCTLIGHT_TRUSTED_ORIGIN: ${FLUCTLIGHT_TRUSTED_ORIGIN:?set FLUCTLIGHT_TRUSTED_ORIGIN in private env}
      BFF_PORT: ${BFF_PORT:-3000}
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${BFF_HOST_PORT:-13000}:${BFF_PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${BFF_PORT:-3000}/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${BFF_MEMORY_LIMIT:-192m}
    networks: [platform]

  web:
    image: ${WEB_IMAGE:-${DOCKERHUB_USERNAME:-yourname}/fluctlight-web:latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      bff:
        condition: service_healthy
    environment:
      FLUCTLIGHT_BFF_ORIGIN: ${FLUCTLIGHT_BFF_ORIGIN:?set FLUCTLIGHT_BFF_ORIGIN in private env}
    ports:
      - "${WEB_HOST_PORT:-13001}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    networks: [platform]

networks:
  platform:
    internal: false

volumes:
  fluctlight_postgres:
  fluctlight_redis:
  fluctlight_minio:
